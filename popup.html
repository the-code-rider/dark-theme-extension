<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dark Mode Toggle</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 200px;
      height: 100px;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
    }

    #toggleBtn {
      background: linear-gradient(90deg, #6200ee, #3700b3);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    #toggleBtn:hover {
      background: linear-gradient(90deg, #3700b3, #6200ee);
      transform: scale(1.02);
    }

    #toggleBtn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <button id="toggleBtn">Loading...</button>
  <script src="popup.js"></script>
</body>
</html>
